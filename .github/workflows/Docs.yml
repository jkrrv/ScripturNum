name: Documentation Update

on:
  push:
    branches:
      - master

jobs:
  docs:
    runs-on: ubuntu-latest
    name: Generate Documentation
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Initialize and update submodule
        run: |
          git submodule update --init --remote docs
          cd docs
          git checkout master
          git pull origin master
          cd ..

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      - name: Install Dev Dependencies
        run: composer update

      - name: Generate Documentation
        run: php ./makeDocs.php --push

      - name: Commit & Push to Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions - update documentation"
          git add *.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-Update Documentation"
            # The wiki is a separate repository from this one, and the checkout step only authenticates this one, so
            # the token is provided here, for this one command.  If the push fails, so does the job.
            auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:master
          fi
          cd ..

      - name: Commit & Push Submodule Update to Main Repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-updated documentation"
            git push origin HEAD:master
          fi
